<main><section><div class="eyebrow" style="text-align:center">OFERTA ESPECIAL</div><h1 class="title">Promociones</h1><p class="subtitle">Una propuesta especial de VELORIA.</p><div id="promos"><div class="notice">Cargando promoción...</div></div></section></main><footer>VELORIA Perfumería · Esencia que deja huella</footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="veloria.js"></script><script>getPromotions().then(async ps=>{const s=await getSettings();document.getElementById('promos').innerHTML=ps.length?ps.map(p=>`<div class="pack"><h3>${escapeHtml(p.name)}</h3><p>${escapeHtml(p.description||'')}</p><p class="offer">Precio de oferta</p><strong>S/${Number(p.price).toFixed(2)}</strong><a class="wa" target="_blank" href="${waLink(s.whatsapp,'Hola, quiero pedir el '+p.name+' de VELORIA')}">Pedir por WhatsApp</a></div>`).join('<div style="height:20px"></div>'):'<div class="notice">No hay promociones activas.</div>';});</script></body></html>
